{% extends 'base.html' %}
{% block title %}Register{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card panel-card shadow-sm card-hover p-4">
            <div class="decorative-line mb-3"></div>
            <h2 class="h4 fw-bold mb-3">Create an account</h2>
            <p class="text-muted mb-4">Sign up to order meals and manage your canteen activity.</p>
            <form method="POST" action="{{ url_for('register') }}">
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-control" placeholder="Choose a username" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" placeholder="Choose a password" required>
                </div>
                <button type="submit" class="btn btn-brand w-100">Register</button>
            </form>
            <p class="text-center text-muted mt-4 mb-0">Already registered? <a href="{{ url_for('login') }}">Login here</a></p>
        </div>
    </div>
</div>
{% endblock %}
