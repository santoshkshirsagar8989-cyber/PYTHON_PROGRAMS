{% extends "base.html" %}
{% block title %}Add Item{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card panel-card shadow-sm card-hover p-4">
            <div class="decorative-line mb-3"></div>
            <h2 class="h4 fw-bold mb-3">Add a new menu item</h2>
            <p class="text-muted mb-4">Create a colorful new dish for students to see and order.</p>
            <form action="{{ url_for('add_item') }}" method="POST" enctype="multipart/form-data">
                <div class="mb-3">
                    <label class="form-label">Item name</label>
                    <input name="name" class="form-control" type="text" placeholder="Example: Paneer Wrap" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Price</label>
                    <input name="price" class="form-control" type="number" min="0" step="0.01" placeholder="₹0.00" required>
                </div>
                <div class="mb-4">
                    <label class="form-label">Photo</label>
                    <input name="photo" class="form-control" type="file" accept="image/*">
                </div>
                <button type="submit" class="btn btn-brand w-100">Add item</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
